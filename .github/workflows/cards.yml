name: Refresh GitHub cards

on:
  schedule:
    - cron: "30 2 * * *"   # every night at 02:30 UTC
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["scripts/make_github_cards.py", ".github/workflows/cards.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/make_github_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gh
          git diff --cached --quiet || (git commit -m "Refresh GitHub cards" && git push)
