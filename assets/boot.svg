<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="t d">
  <title id="t">obeaj — boot log</title>
  <desc id="d">Animated terminal: Ousama Beaj, software engineer from 1337 / 42 Network, fullstack and systems, looking for a PFE internship.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".55" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" fill-opacity=".018"/>
    </pattern>
    <clipPath id="win"><rect x="1" y="1" width="878" height="358" rx="14"/></clipPath>
  </defs>
  <style>
    text { white-space: pre; font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #c9d1d9; }
    .dim  { fill: #6e7681; }
    .ok   { fill: #3fb950; font-weight: 700; }
    .wait { fill: #e3b341; font-weight: 700; }
    .cy   { fill: #22d3ee; }
    .mg   { fill: #f778ba; }
    .wh   { fill: #f0f6fc; font-weight: 700; }
    .title { font-size: 13px; fill: #8b949e; }
    .l { opacity: 0; animation: in .35s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    .l1 { animation-delay: .3s; }  .l2 { animation-delay: 1.0s; } .l3 { animation-delay: 1.6s; }
    .l4 { animation-delay: 2.2s; } .l5 { animation-delay: 2.8s; } .l6 { animation-delay: 3.4s; }
    .l7 { animation-delay: 4.0s; } .l8 { animation-delay: 4.8s; } .l9 { animation-delay: 5.6s; }
    .cursor { opacity: 0; animation: blink 1s 5.7s step-end infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 0; } }
    .bar { transform-origin: 0 0; transform: scaleX(0); animation: fill 5.3s .3s cubic-bezier(.4,0,.2,1) forwards, settle .8s 5.8s ease-out forwards; }
    @keyframes fill { to { transform: scaleX(1); } }
    @keyframes settle { from { opacity: 1; } to { opacity: .45; } }
    .booting { animation: out .4s 5.6s forwards; }
    .ready   { opacity: 0; animation: in2 .4s 5.8s forwards; }
    @keyframes out { to { opacity: 0; } }
    @keyframes in2 { to { opacity: 1; } }
    .online  { opacity: 0; animation: in2 .4s 5.8s forwards; }
    .dot     { animation: pulse 2s 6.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .on { font-size: 12px; fill: #3fb950; }
  </style>

  <g clip-path="url(#win)">
    <rect width="880" height="360" fill="url(#bg)"/>
    <rect width="880" height="360" fill="url(#scan)"/>
    <rect width="880" height="360" fill="url(#vig)"/>
    <!-- title bar -->
    <rect width="880" height="38" fill="#161b22"/>
    <circle cx="22" cy="19" r="6" fill="#ff5f57"/><circle cx="42" cy="19" r="6" fill="#febc2e"/><circle cx="62" cy="19" r="6" fill="#28c840"/>
    <text x="440" y="24" text-anchor="middle" class="title booting">obeaj@1337 — tty1 — booting obeaj-os…</text>
    <text x="440" y="24" text-anchor="middle" class="title ready">obeaj@1337 — tty1 — obeaj-os ready</text>
    <g class="online"><circle class="dot" cx="806" cy="19" r="4" fill="#3fb950"/><text x="816" y="23" class="on">online</text></g>
    <!-- boot progress -->
    <rect x="0" y="38" width="880" height="2" fill="#21262d"/>
    <rect class="bar" x="0" y="38" width="880" height="2" fill="url(#prog)"/>

    <text class="l l1" x="28" y="76"><tspan class="dim">obeaj-os 20.43 (i386) · grub: booting kernel… </tspan><tspan class="cy">Ousama Beaj</tspan><tspan class="dim"> · software engineer</tspan></text>
    <text class="l l2" x="28" y="108"><tspan class="dim">[</tspan><tspan class="ok">  OK  </tspan><tspan class="dim">] </tspan>Loaded GDT, IDT and IRQ handlers <tspan class="dim">· wrote this kernel from scratch</tspan></text>
    <text class="l l3" x="28" y="136"><tspan class="dim">[</tspan><tspan class="ok">  OK  </tspan><tspan class="dim">] </tspan>Mounted <tspan class="cy">/home/1337</tspan> <tspan class="dim">· 42 Network · level 20.43 · RNCP 7</tspan></text>
    <text class="l l4" x="28" y="164"><tspan class="dim">[</tspan><tspan class="ok">  OK  </tspan><tspan class="dim">] </tspan>Started <tspan class="cy">fullstack.service</tspan> <tspan class="dim">· TypeScript · Next.js · NestJS · PostgreSQL</tspan></text>
    <text class="l l5" x="28" y="192"><tspan class="dim">[</tspan><tspan class="ok">  OK  </tspan><tspan class="dim">] </tspan>Reached <tspan class="cy">production.target</tspan> <tspan class="dim">· FutureCorp, Paris · 16 months</tspan></text>
    <text class="l l6" x="28" y="220"><tspan class="dim">[</tspan><tspan class="ok">  OK  </tspan><tspan class="dim">] </tspan>Enabled <tspan class="cy">security.module</tspan> <tspan class="dim">· exploitation · reverse engineering · gdb</tspan></text>
    <text class="l l7" x="28" y="248"><tspan class="dim">[</tspan><tspan class="ok">  OK  </tspan><tspan class="dim">] </tspan>Listening on <tspan class="mg">pongmasters</tspan><tspan class="dim">,</tspan> <tspan class="mg">leetube</tspan><tspan class="dim">,</tspan> <tspan class="mg">tetris</tspan><tspan class="dim">.obeaj.me</tspan></text>
    <text class="l l8" x="28" y="276"><tspan class="dim">[</tspan><tspan class="wait"> WAIT </tspan><tspan class="dim">] </tspan>Looking for: <tspan class="wh">6-month PFE internship</tspan> <tspan class="dim">· remote or on-site · available now</tspan></text>
    <text class="l l9" x="28" y="318"><tspan class="ok">obeaj@1337</tspan><tspan class="dim">:</tspan><tspan class="cy">~</tspan><tspan class="dim">$ </tspan><tspan class="wh">./hire --me</tspan></text>
    <rect class="cursor" x="256" y="304" width="9" height="18" fill="#3fb950"/>
  </g>
  <rect x=".5" y=".5" width="879" height="359" rx="14" fill="none" stroke="#30363d"/>
</svg>
