<svg xmlns="http://www.w3.org/2000/svg" width="430" height="190" viewBox="0 0 430 190" role="img" aria-label="red-tetris: Multiplayer Tetris with an authoritative game server: every board runs server-side, one seed per round.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7b72"/><stop offset="1" stop-color="#ff7b72" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="428" height="188" rx="12"/></clipPath>
  </defs>
  <style>
    .title { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 17px; font-weight: 700; fill: #f0f6fc; }
    .tilde { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 17px; fill: #ff7b72; }
    .desc  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #9da7b3; }
    .chip  { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #ff7b72; }
    .foot  { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #6e7681; }
    .live  { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; font-weight: 700; fill: #3fb950; }
    .pulse { animation: p 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes p { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    .glow { animation: g 4s ease-in-out infinite; }
    @keyframes g { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="430" height="190" fill="url(#bg)"/>
    <rect class="glow" width="430" height="3" fill="url(#ac)"/>
    <circle cx="400" cy="220" r="110" fill="#ff7b72" fill-opacity=".05"/>
    <text x="24" y="46"><tspan class="tilde">~/</tspan><tspan class="title">red-tetris</tspan></text>
    <rect x="346" y="30" width="62" height="22" rx="11" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".5"/><circle class="pulse" cx="360" cy="41" r="4" fill="#3fb950"/><text x="370" y="46" class="live">LIVE</text>
    <text x="24" y="76" class="desc">Multiplayer Tetris with an authoritative game server:</text><text x="24" y="96" class="desc">every board runs server-side, one seed per round.</text>
    <rect x="24" y="128" width="54" height="22" rx="11" fill="#ff7b72" fill-opacity=".12" stroke="#ff7b72" stroke-opacity=".35"/><text x="51.0" y="143" text-anchor="middle" class="chip">React</text><rect x="86" y="128" width="91" height="22" rx="11" fill="#ff7b72" fill-opacity=".12" stroke="#ff7b72" stroke-opacity=".35"/><text x="131.5" y="143" text-anchor="middle" class="chip">TypeScript</text><rect x="185" y="128" width="83" height="22" rx="11" fill="#ff7b72" fill-opacity=".12" stroke="#ff7b72" stroke-opacity=".35"/><text x="226.5" y="143" text-anchor="middle" class="chip">Socket.IO</text>
    <line x1="24" y1="164" x2="406" y2="164" stroke="#21262d"/>
    <text x="24" y="180" class="foot">tetris.obeaj.me</text>
    <text x="406" y="180" text-anchor="end" class="foot" style="fill:#ff7b72">↗</text>
  </g>
  <rect x=".5" y=".5" width="429" height="189" rx="12" fill="none" stroke="#30363d"/>
</svg>
