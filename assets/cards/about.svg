<svg xmlns="http://www.w3.org/2000/svg" width="880" height="306" viewBox="0 0 880 306" role="img" aria-label="16 mo production experience. 3 apps live in production. 20.43 level at 1337 / 42. RNCP 7 master&#x27;s level title. EXPERIENCE: FutureCorp · Paris (remote). Main engineer on CMS-driven Next.js platforms for Beige Pill and Fleming Watch. Maintained sites for Saatchi &amp; Saatchi UK and The Brooklyn Tower. 1337 / 42: Final year · common core 100%. Went deep on the layers underneath: x86 kernel, Unix shell, HTTP server, binary exploitation, BGP-EVPN, Kubernetes with GitOps. NOW: Fullstack, end to end. I build full-stack systems and run them myself in production on cloud VMs: Caddy, Nginx, TLS, Docker, PostgreSQL.">
