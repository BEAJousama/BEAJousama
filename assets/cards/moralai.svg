<svg xmlns="http://www.w3.org/2000/svg" width="430" height="190" viewBox="0 0 430 190" role="img" aria-label="MoralAi: Workplace mental-health check-in companion: LLM chat and assessments with Gemini or a local Llama.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a371f7"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="428" height="188" rx="12"/></clipPath>
  </defs>
  <style>
    .title { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 17px; font-weight: 700; fill: #f0f6fc; }
    .tilde { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 17px; fill: #a371f7; }
    .desc  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #9da7b3; }
    .chip  { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #a371f7; }
    .foot  { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #6e7681; }
    .live  { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; font-weight: 700; fill: #3fb950; }
    .pulse { animation: p 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes p { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    .glow { animation: g 4s ease-in-out infinite; }
    @keyframes g { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="430" height="190" fill="url(#bg)"/>
    <rect class="glow" width="430" height="3" fill="url(#ac)"/>
    <circle cx="400" cy="220" r="110" fill="#a371f7" fill-opacity=".05"/>
    <text x="24" y="46"><tspan class="tilde">~/</tspan><tspan class="title">MoralAi</tspan></text>
    
    <text x="24" y="76" class="desc">Workplace mental-health check-in companion: LLM chat</text><text x="24" y="96" class="desc">and assessments with Gemini or a local Llama.</text>
    <rect x="24" y="128" width="54" height="22" rx="11" fill="#a371f7" fill-opacity=".12" stroke="#a371f7" stroke-opacity=".35"/><text x="51.0" y="143" text-anchor="middle" class="chip">React</text><rect x="86" y="128" width="69" height="22" rx="11" fill="#a371f7" fill-opacity=".12" stroke="#a371f7" stroke-opacity=".35"/><text x="120.5" y="143" text-anchor="middle" class="chip">Node.js</text><rect x="163" y="128" width="61" height="22" rx="11" fill="#a371f7" fill-opacity=".12" stroke="#a371f7" stroke-opacity=".35"/><text x="193.5" y="143" text-anchor="middle" class="chip">Ollama</text><rect x="232" y="128" width="61" height="22" rx="11" fill="#a371f7" fill-opacity=".12" stroke="#a371f7" stroke-opacity=".35"/><text x="262.5" y="143" text-anchor="middle" class="chip">Gemini</text>
    <line x1="24" y1="164" x2="406" y2="164" stroke="#21262d"/>
    <text x="24" y="180" class="foot">github.com/BEAJousama/MoralAi</text>
    <text x="406" y="180" text-anchor="end" class="foot" style="fill:#a371f7">›</text>
  </g>
  <rect x=".5" y=".5" width="429" height="189" rx="12" fill="none" stroke="#30363d"/>
</svg>
