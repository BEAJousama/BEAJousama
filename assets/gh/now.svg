<svg xmlns="http://www.w3.org/2000/svg" width="880" height="332" viewBox="0 0 880 332" role="img" aria-label="./now: build local AI security reviewer (LLM agent that reviews pull requests); learn AI from scratch (tokens, embeddings, attention, RAG, evals); practice DSA + system design (every morning); open 6-month PFE internship (remote or on-site, available now); live: pongmasters.obeaj.me online, leetube.obeaj.me online, tetris.obeaj.me online">
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#252c47"/></pattern>
  </defs>
  <style>text.x { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; } .b { font-weight: 800; }</style>
  <rect x="1" y="1" width="878" height="330" rx="14" fill="#161b2e" stroke="#2a3150" stroke-width="1.5"/>
  <rect x="1" y="1" width="878" height="330" rx="14" fill="url(#dots)"/>
  <style>
    text { white-space: pre; font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #c9d1d9; }
    .b { font-weight: 800; } .dim { fill: #8b949e; } .wh { fill: #f0f6fc; font-weight: 700; }
    .cy { fill: #22d3ee; } .ok { fill: #3fb950; }
    .l { opacity: 0; animation: in .35s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    .bar { transform-origin: 0 0; transform: scaleX(0); animation: fill 3.4s .2s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes fill { to { transform: scaleX(1); } }
    .cursor { opacity: 0; animation: blink 1s 4.20s step-end infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 0; } }
    .dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
  <rect x="1" y="1" width="878" height="44" rx="14" fill="#1d2338"/><rect x="1" y="30" width="878" height="15" fill="#1d2338"/>
  <rect x="1" y="45" width="878" height="2" fill="#2a3150"/>
  <rect class="bar" x="1" y="45" width="878" height="2" fill="#22d3ee"/>
  <circle cx="26" cy="23" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="23" r="6" fill="#febc2e"/>
  <circle cx="66" cy="23" r="6" fill="#28c840"/>
