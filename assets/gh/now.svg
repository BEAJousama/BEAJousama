  <g class="l" style="animation-delay:2.50s"><rect x="32" y="199" width="85" height="24" rx="6" fill="#7a2335"/><text x="75" y="216" text-anchor="middle" class="b" font-size="13" style="fill:#ffd0d8">OPEN</text><text x="133" y="216"><tspan class="wh">6-month PFE internship</tspan><tspan class="dim">  ·  remote or on-site, available now</tspan></text></g>
  <g class="l" style="animation-delay:3.05s"><rect x="32" y="233" width="85" height="24" rx="6" fill="#1f4a2c"/><text x="75" y="250" text-anchor="middle" class="b" font-size="13" style="fill:#aff5b4">LIVE</text><text x="133" y="250"><tspan style="fill:#3fb950">● </tspan><tspan class="wh">pongmasters</tspan><tspan class="dim">.obeaj.me   </tspan><tspan style="fill:#3fb950">● </tspan><tspan class="wh">leetube</tspan><tspan class="dim">.obeaj.me   </tspan><tspan style="fill:#3fb950">● </tspan><tspan class="wh">tetris</tspan><tspan class="dim">.obeaj.me   </tspan></text></g>
  <text class="l" style="animation-delay:3.60s" x="32" y="296"><tspan class="ok b">obeaj@1337</tspan><tspan class="dim">:</tspan><tspan class="cy">~</tspan><tspan class="dim">$ </tspan><tspan class="wh">./hire --me</tspan></text>
  <rect class="cursor" x="270" y="282" width="9" height="18" fill="#22d3ee"/>
