  <g class="l" style="animation-delay:0.85s"><rect x="32" y="97" width="85" height="24" rx="6" fill="#4a3a85"/><text x="75" y="114" text-anchor="middle" class="b" font-size="13" style="fill:#e0d4ff">BUILD</text><text x="133" y="114"><tspan class="wh">local AI security reviewer</tspan><tspan class="dim">  ·  LLM agent that reviews pull requests</tspan></text></g>
  <g class="l" style="animation-delay:1.40s"><rect x="32" y="131" width="85" height="24" rx="6" fill="#1d4e89"/><text x="75" y="148" text-anchor="middle" class="b" font-size="13" style="fill:#cfe3ff">LEARN</text><text x="133" y="148"><tspan class="wh">AI from scratch</tspan><tspan class="dim">  ·  tokens, embeddings, attention, RAG, evals</tspan></text></g>
